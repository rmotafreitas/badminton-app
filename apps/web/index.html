    <title>Badminton Buddy</title>
    <meta name="description" content="Your club's games, ratings, training and rally analysis." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a15" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Content runs under the status bar (it pads itself with safe-area-inset-top), so the bar takes the app's colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="Badminton" />
    <script>
      // Wake the API (a serverless cold start, plus its first MongoDB connection) while the app's code downloads,
      // instead of after: the session check that follows then usually lands on a warm server.
      // The body is read so the request completes (an unread body keeps it open in the browser).
      try { fetch("/api/health/ready", { cache: "no-store", credentials: "omit" }).then(function (r) { return r.text(); }).catch(function () {}); } catch (e) {}
    </script>
    <script>
      // Theme before first paint (no light flash in dark mode). Same rule as src/shared/theme.tsx.
      (function () {
        try {
          var t = localStorage.getItem("bb-theme");
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (t === "light" || t === "dark") {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", t === "dark" ? "#121a15" : "#ffffff"); m.removeAttribute("media"); });
          }
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", "#121a15"); m.removeAttribute("media"); });
          }
        } catch (e) {}
      })();
    </script>
