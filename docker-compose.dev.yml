services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot container that initiates the replica set after MongoDB is up
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 \
          --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
              print("Replica set initiated");
            } catch(e) {
              if (e.codeName === "AlreadyInitialized") { print("Already a replica set"); }
              else { throw e; }
            }
          '
        sleep 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/src:/app/src          # hot-reload source
      - ./backend/certs:/app/certs      # local HTTPS certs (mkcert)
    environment:
      IN_DEV: ${IN_DEV:-local}
      DATABASE_URL: mongodb://mongo:27017/avatarlabs?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-https://localhost:5173}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:5173}
      ENABLE_LOCAL_HTTPS: ${ENABLE_LOCAL_HTTPS:-false}
    ports:
      - "3000:3000"

volumes:
  mongo_data_dev:
