services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot container that initiates the replica set after MongoDB is up
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 \
          --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
              print("Replica set initiated");
            } catch(e) {
              if (e.codeName === "AlreadyInitialized") { print("Already a replica set"); }
              else { throw e; }
            }
          '
        sleep 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/src:/app/src          # hot-reload source
      - ./backend/certs:/app/certs      # local HTTPS certs (mkcert)
      - ./.env:/app/.env                # mounted so entrypoint can watch for changes
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  mongo_data_dev:
