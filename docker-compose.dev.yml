services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot container that initiates the replica set after MongoDB is up
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 \
          --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
              print("Replica set initiated");
            } catch(e) {
              if (e.codeName === "AlreadyInitialized") { print("Already a replica set"); }
              else { throw e; }
            }
          '
        sleep 3

  # Local S3-compatible object storage (stand-in for Cloudflare R2 in dev).
  # S3 API on http://localhost:8333 — dev-only credentials in infra/seaweedfs/s3.json
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=*
    volumes:
      - seaweed_data_dev:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"

  # One-shot container that creates the dev bucket
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    depends_on:
      - seaweedfs
    entrypoint: ["sh", "-c"]
    command:
      - |
        i=0
        while [ $$i -lt 30 ]; do
          i=$$((i+1))
          if echo "s3.bucket.create -name rally-dev" | weed shell -master=seaweedfs:9333 2>&1 | grep -qiE "created|exist"; then
            echo "bucket ready"; exit 0
          fi
          sleep 2
        done
        echo "bucket creation failed"; exit 1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/src:/app/src          # hot-reload source
      - ./backend/certs:/app/certs      # local HTTPS certs (mkcert)
      - ./.env:/app/.env                # mounted so entrypoint can watch for changes
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  mongo_data_dev:
  seaweed_data_dev:
